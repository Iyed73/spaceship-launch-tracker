name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: launchvault
          POSTGRES_PASSWORD: launchvault
          POSTGRES_DB: launchvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launchvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: test-secret-key
      SECURITY_PASSWORD_SALT: test-salt
      DEV_DATABASE_URL: postgresql://launchvault:launchvault@127.0.0.1:5432/launchvault_test
      TEST_DATABASE_URL: postgresql://launchvault:launchvault@127.0.0.1:5432/launchvault_test
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_EMAIL: launchvault@example.com
      MAIL_SERVER: localhost
      MAIL_PORT: 587
      MAIL_USERNAME: test
      MAIL_PASSWORD: test
      MAIL_DEFAULT_SENDER: launchvault@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
